<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Ring / Shield Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 12"/>

  <!-- Left Node (Personal / Blue) -->
  <g transform="translate(190, 240)">
    <circle cx="0" cy="0" r="82" fill="url(#blueGrad)" opacity="0.9" filter="url(#glow)"/>
    <!-- Wallet / Card Minimal Glyph -->
    <path d="M-30 -22 L30 -22 C36 -22 40 -18 40 -12 L40 22 C40 28 36 32 30 32 L-30 32 C-36 32 -40 28 -40 22 L-40 -12 C-40 -18 -36 -22 -30 -22 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M12 0 L26 0 M18 0 A4 4 0 0 1 22 4 A4 4 0 0 1 18 8 L18 -8 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Node (Partner / Emerald) -->
  <g transform="translate(322, 240)">
    <circle cx="0" cy="0" r="82" fill="url(#emeraldGrad)" opacity="0.85" filter="url(#glow)"/>
    <!-- Trending / Sparkle Glyph -->
    <path d="M-24 16 L-6 -2 L10 14 L30 -6" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 -6 L30 -6 L30 6" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Intersecting 50/50 Harmony Core Badge -->
  <g transform="translate(256, 350)">
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
      50 / 50
    </text>
  </g>
</svg>
